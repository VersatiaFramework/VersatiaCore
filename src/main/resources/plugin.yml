name: VersatiaCore
version: '${version}'
main: dev.versatia.VersatiaCore
api-version: '26.3'
author: Versatia
description: Core of the Versatia framework.
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}
  - org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}
  # Maven Resolver reads POMs only, so the JVM artifact is named, not the multiplatform one
  - org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${coroutinesVersion}
# Optional: with the CommandAPI plugin installed, VersatiaCore registers /versatia
softdepend:
  - CommandAPI
permissions:
  versatia.core.command.reload:
    description: Reloads Versatia plugins with /versatia reload.
    default: op
  versatia.core.command.info:
    description: Shows the running Versatia plugins and their beans with /versatia info.
    default: op
